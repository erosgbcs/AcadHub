name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [ main ]

# Grant write permission to the repository
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy frontend files to site root
        run: |
          mkdir -p site
          cp -r frontend/* site/
          ls site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
