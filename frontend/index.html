<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadHub Suite | Smart Academic Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: #0a0f1e; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(30,41,59,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; padding: 1.5rem; }
        .btn-primary { background: linear-gradient(135deg, #4c6ef5, #22b8cf); }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <!-- Header -->
        <div class="glass-card flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center text-white text-xl"><i class="fa-solid fa-graduation-cap"></i></div>
                <div><h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">AcadHub</h1><p class="text-xs text-slate-400">Study Suite</p></div>
            </div>
            <div id="backendStatus" class="px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">🟢 ONLINE</div>
        </div>

        <!-- Tabs -->
        <div class="flex p-1.5 bg-slate-800/50 rounded-2xl">
            <button id="tabReviewer" class="flex-1 py-3 rounded-xl text-sm font-semibold bg-gradient-to-r from-blue-600 to-cyan-500 text-white">AI Reviewer</button>
            <button id="tabScheduler" class="flex-1 py-3 rounded-xl text-sm font-semibold text-slate-400">Scheduler</button>
        </div>

        <!-- Reviewer Tab -->
        <div id="viewReviewer" class="space-y-6">
            <div class="glass-card">
                <h2 class="text-lg font-bold mb-4">Generate Study Materials</h2>
                <form id="reviewerForm" onsubmit="return false;">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-300">AI Engine</label>
                            <select id="aiProvider" onchange="updateProviderUI()" class="w-full py-3 px-3 bg-slate-800 border border-slate-600 rounded-xl text-sm text-white">
                                <option value="local" selected>🧠 Local NLP (No Key)</option>
                                <option value="gemini">Google Gemini AI</option>
                                <option value="deepseek">DeepSeek AI</option>
                            </select>
                        </div>
                        <div id="apiKeyContainer" class="sm:col-span-2" style="display:none;">
                            <label class="block text-xs font-semibold mb-1 text-slate-300" id="apiKeyLabel">API Key</label>
                            <div class="relative">
                                <input type="password" id="apiKey" placeholder="Paste API key..." class="w-full pl-10 pr-12 py-3 bg-slate-800 border border-slate-600 rounded-xl text-sm text-white placeholder-slate-500">
                                <span class="absolute left-3 top-3 text-slate-500"><i class="fa-solid fa-key text-xs"></i></span>
                                <button type="button" onclick="toggleApiKeyVisibility()" class="absolute right-3 top-3 text-slate-500"><i class="fa-solid fa-eye text-xs" id="toggleEyeIcon"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-semibold mb-1 text-slate-300">Upload Document</label>
                        <label for="fileInput" class="flex flex-col items-center justify-center w-full p-8 border-2 border-dashed border-slate-600 rounded-2xl cursor-pointer bg-slate-800/40 hover:border-blue-500/50 transition">
                            <div class="w-16 h-16 rounded-full bg-blue-500/10 flex items-center justify-center mb-2"><i class="fa-solid fa-cloud-arrow-up text-2xl text-blue-400"></i></div>
                            <p class="text-sm text-slate-300" id="fileNameDisplay">Drop file or click to browse</p>
                            <p class="text-xs text-slate-500">PDF, DOCX, TXT (max 15 pages)</p>
                            <input id="fileInput" type="file" accept=".pdf,.docx,.txt" class="hidden" onchange="updateFileName(this)" />
                        </label>
                    </div>

                    <div class="mb-4">
                        <label class="block text-xs font-semibold mb-1 text-slate-300">Notes (Optional)</label>
                        <textarea id="studyNotes" rows="4" placeholder="Paste your notes here..." class="w-full p-4 bg-slate-800 border border-slate-600 rounded-xl text-sm text-white placeholder-slate-500 resize-none"></textarea>
                    </div>

                    <button type="button" id="submitBtn" onclick="handleGenerate()" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-sm shadow-lg">
                        <span id="btnContent"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Generate Study Materials</span>
                    </button>
                </form>

                <!-- Progress Bar -->
                <div id="progressContainer" class="hidden mt-6 pt-6 border-t border-slate-700">
                    <div class="flex items-center justify-between text-sm mb-2">
                        <span id="progressStatus" class="text-blue-300"><i class="fa-solid fa-spinner animate-spin mr-2"></i>Initializing...</span>
                        <span id="progressPercent" class="text-slate-400 font-mono">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                        <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full transition-all duration-300" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div id="resultsContainer" class="hidden space-y-6">
                <div class="glass-card border-l-4 border-l-blue-500">
                    <h3 class="text-sm font-bold uppercase text-blue-400 mb-3">📌 Key Concepts</h3>
                    <ul id="summaryList" class="space-y-2 text-sm text-slate-300"></ul>
                </div>
                <div class="glass-card border-l-4 border-l-cyan-500">
                    <h3 class="text-sm font-bold uppercase text-cyan-400 mb-3">🃏 Flashcards</h3>
                    <div id="flashcardGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>
                <div class="glass-card border-l-4 border-l-teal-500">
                    <h3 class="text-sm font-bold uppercase text-teal-400 mb-3">❓ Practice Quiz</h3>
                    <div id="quizContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8000";
        let progressTimer = null;

        function updateProviderUI() {
            const provider = document.getElementById('aiProvider').value;
            const box = document.getElementById('apiKeyContainer');
            const input = document.getElementById('apiKey');
            if (provider === 'local') {
                box.style.display = 'none';
                input.required = false;
            } else {
                box.style.display = 'block';
                input.required = true;
                if (provider === 'gemini') {
                    document.getElementById('apiKeyLabel').innerHTML = '🔑 Gemini API Key';
                    input.placeholder = 'AIzaSy...';
                } else if (provider === 'deepseek') {
                    document.getElementById('apiKeyLabel').innerHTML = '🔑 DeepSeek API Key';
                    input.placeholder = 'sk-...';
                }
            }
        }

        function toggleApiKeyVisibility() {
            const input = document.getElementById('apiKey');
            const icon = document.getElementById('toggleEyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function updateFileName(input) {
            const nameDisplay = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                nameDisplay.innerHTML = `<span class="text-blue-400 font-semibold">${input.files[0].name}</span> <span class="text-slate-500 text-xs">(${(input.files[0].size/1024).toFixed(1)} KB)</span>`;
                nameDisplay.parentElement.classList.add('border-blue-500/50', 'bg-blue-500/5');
            } else {
                nameDisplay.textContent = 'Drop file or click to browse';
                nameDisplay.parentElement.classList.remove('border-blue-500/50', 'bg-blue-500/5');
            }
        }

        function startProgressAnimation() {
            const container = document.getElementById('progressContainer');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('progressStatus');
            const percent = document.getElementById('progressPercent');
            container.classList.remove('hidden');
            bar.style.width = '0%';
            let progress = 0;
            progressTimer = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                    bar.style.width = progress + '%';
                    percent.textContent = Math.floor(progress) + '%';
                    if (progress < 30) status.innerHTML = '<i class="fa-solid fa-file-lines text-blue-400 mr-2"></i>Extracting content...';
                    else if (progress < 60) status.innerHTML = '<i class="fa-solid fa-brain text-teal-400 mr-2"></i>Processing...';
                    else status.innerHTML = '<i class="fa-solid fa-list-check text-amber-400 mr-2"></i>Generating results...';
                }
            }, 500);
        }

        function stopProgressAnimation(success = true) {
            clearInterval(progressTimer);
            const bar = document.getElementById('progressBar');
            const percent = document.getElementById('progressPercent');
            const status = document.getElementById('progressStatus');
            bar.style.width = '100%';
            percent.textContent = '100%';
            status.innerHTML = success ? '<i class="fa-solid fa-circle-check text-teal-400 mr-2"></i>Complete!' : '<i class="fa-solid fa-circle-exclamation text-rose-400 mr-2"></i>Failed';
            setTimeout(() => document.getElementById('progressContainer').classList.add('hidden'), 1500);
        }

        async function handleGenerate() {
            const btn = document.getElementById('submitBtn');
            const btnContent = document.getElementById('btnContent');
            const provider = document.getElementById('aiProvider').value;
            const apiKey = document.getElementById('apiKey').value;
            const notes = document.getElementById('studyNotes').value;
            const fileInput = document.getElementById('fileInput');

            if (provider !== 'local' && !apiKey.trim()) {
                alert('Please enter your API key');
                return;
            }

            btn.disabled = true;
            btnContent.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i>Processing...';
            startProgressAnimation();

            const formData = new FormData();
            if (provider !== 'local') formData.append('api_key', apiKey);
            formData.append('provider', provider);
            formData.append('notes', notes);
            if (fileInput.files[0]) formData.append('file', fileInput.files[0]);

            const endpoint = provider === 'local'
                ? `${BACKEND_URL}/api/generate-reviewer-local`
                : `${BACKEND_URL}/api/generate-reviewer`;

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Generation failed');
                stopProgressAnimation(true);
                renderResults(data);
            } catch (err) {
                stopProgressAnimation(false);
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btnContent.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Generate Study Materials';
            }
        }

        function renderResults(data) {
            const container = document.getElementById('resultsContainer');
            container.classList.remove('hidden');
            container.scrollIntoView({ behavior: 'smooth' });

            document.getElementById('summaryList').innerHTML = (data.summary || []).map(s => `<li class="flex items-start gap-2 p-3 rounded-xl bg-slate-800/40"><i class="fa-solid fa-check text-blue-400 mt-0.5"></i>${s}</li>`).join('');

            document.getElementById('flashcardGrid').innerHTML = (data.flashcards || []).map(c => `<div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl"><p class="text-sm font-bold text-white">${c.term}</p><p class="text-xs text-slate-400 mt-1">${c.definition}</p></div>`).join('');

            document.getElementById('quizContainer').innerHTML = (data.quiz || []).map((q, i) => `
                <div class="bg-slate-800/60 border border-slate-700 p-4 rounded-xl">
                    <p class="text-sm font-semibold text-white mb-2">${i+1}. ${q.question}</p>
                    ${q.options.map((opt, idx) => `
                        <button onclick="checkAnswer(this, '${opt === q.answer}')" class="quiz-option w-full text-left p-3 rounded-lg bg-slate-800 text-sm text-slate-300 border border-slate-700 mt-1 hover:bg-blue-500/10 transition">
                            <span class="w-6 h-6 rounded-full bg-slate-700 inline-flex items-center justify-center text-xs font-bold mr-2">${String.fromCharCode(65+idx)}</span>${opt}
                        </button>
                    `).join('')}
                </div>
            `).join('');
        }

        function checkAnswer(btn, isCorrect) {
            const parent = btn.parentElement;
            Array.from(parent.children).forEach(child => {
                child.classList.remove('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300', 'bg-rose-500/20', 'border-rose-500', 'text-rose-300');
            });
            if (isCorrect === 'true') {
                btn.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-300');
            } else {
                btn.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-300');
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            updateProviderUI();
        });
    </script>
</body>
</html>
